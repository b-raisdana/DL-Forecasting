[pytest]
minversion = 7.0
testpaths = app/tests
pythonpath = app
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers --import-mode=importlib
markers =
    unit: fast, isolated, no I/O
    characterization: pins current behavior of legacy/unspecced code before refactor
    integration: multiple modules/stages wired together
    regression: guards one specific previously-true invariant
    smoke: minimal "still imports/builds/runs one step" check
    e2e: full pipeline, real/pinned data, slow
    perf: throughput/performance budget check
