repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # This whole run executes inside the WSL "tf" conda env (see .git/hooks/pre-commit and
  # docs/infrastructure.md#environments) - it's where the real deps (pandas, tensorflow,
  # pandera, ...) live, so mypy/pytest resolve real types/imports instead of falling back
  # to Any. ruff/xenon don't need those deps but run here too now for a single environment.
  - repo: local
    hooks:
      - id: xenon
        name: xenon (cyclomatic complexity gate)
        language: python
        additional_dependencies: ["xenon==0.9.3"]
        entry: xenon --max-absolute B --max-modules A --max-average A
        types: [python]
        files: ^app/

      - id: mypy
        name: mypy --strict --disallow-any-explicit
        language: system
        entry: python -m mypy --config-file pyproject.toml
        types: [python]
        files: ^app/

      - id: pytest-fast
        name: pytest fast gate (unit/characterization/regression/smoke)
        language: system
        entry: python -m pytest -m "unit or characterization or regression or smoke"
        pass_filenames: false
        files: ^(app/.*\.py|pytest\.ini)$
