repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # --exit-zero: auto-fix what's safely fixable, report the rest, but never hard-block on
      # it here - ruff is also an incremental-ratchet vector (only blocks on a project-wide
      # regression), so this hook shouldn't independently force-fix a whole touched legacy
      # file's unrelated pre-existing violations. ruff-format has no "unfixable" concept
      # (deterministic rewrite), so it's left as a normal blocking-until-restaged hook.
      - id: ruff
        args: ["--fix", "--exit-zero"]
      - id: ruff-format

  # This whole run executes inside the WSL "tf" conda env (see .git/hooks/pre-commit and
  # docs/infrastructure.md#environments) - it's where the real deps (pandas, tensorflow,
  # pandera, ...) live, so mypy/pytest resolve real types/imports instead of falling back
  # to Any. ruff doesn't need those deps but runs here too now for a single environment.
  - repo: local
    hooks:
      # mypy (strict/no-Any) and complexity (xenon-equivalent) are NOT gated per-file/strict
      # here - both tools analyze whole files, so that would turn any one-line edit to a
      # legacy file into a forced cleanup of every unrelated pre-existing violation in it.
      # incremental-ratchet only blocks a REGRESSION in the project-wide count for each -
      # see scripts/git-hooks/incremental-precommit/README.md.
      - id: incremental-ratchet
        name: incremental ratchet (mypy/ruff/xenon/loc - blocks regressions only, see README)
        language: system
        entry: python scripts/git-hooks/incremental-precommit/ratchet_check.py
        pass_filenames: false
        files: ^app/.*\.py$

      - id: pytest-fast
        name: pytest unit gate
        language: system
        entry: python -m pytest -m unit
        pass_filenames: false
        files: ^(app/.*\.py|pytest\.ini)$

      - id: sync-skill-files
        name: sync mirrored skill files (single source of truth)
        language: system
        entry: sh scripts/git-hooks/sync-skill-files.sh
        pass_filenames: false
        files: ^(\.claude/skills/[^/]+/SKILL\.md|\.codex/skills/[^/]+/SKILL\.md|\.github/git-commit/SKILL\.md)$
